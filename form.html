<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="desain/style3.css">
</head>

<body>

    <header>
        Aplikasi Manajemen Pegawai
    </header>

    <div class="container">
        
        <aside>
            <ul class="menu">
                <li><a href="dashboard.html" class="aktif">Dashboard</a></li>
                <li><a href="tabel.html">Data Pegawai</a></li>
                <li><a href="jabatan.html">Data Jabatan</a></li>
                <li><a href="login.html">Keluar</a></li>
            </ul>
        </aside>

        <section class="main">
            <h2 class="judul">Tambah Pegawai</h2>

            <form action="proses.php" method="post" enctype="multipart/form-data">

                <div class="form-group">
                    <label for="foto">Foto</label>
                    <div class="input"><input type="file" id="foto" name="foto"></div>
                </div>

                <div class="form-group">
                    <label for="nama">Nama</label>
                    <div class="input"><input type="text" id="nama" name="nama" required></div>
                </div>

                <div class="form-group">
                    <label>Jenis Kelamin</label>
                    <div class="input">
                        <input type="radio" id="jk_l" name="jk" value="L">
                        <label for="jk_l">Laki-laki</label>

                        <input type="radio" id="jk_p" name="jk" value="P">
                        <label for="jk_p">Perempuan</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="tanggal">Tanggal Lahir</label>
                    <div class="input">
                        <input type="date" id="tanggal" name="tanggal">
                    </div>
                </div>

                <div class="form-group">
                    <label for="jabatan">Jabatan</label>
                    <div class="input">
                        <select id="jabatan" name="jabatan">
                            <option value="direktur">Direktur</option>
                            <option value="manajer">Manajer</option>
                            <option value="marketing">Marketing</option>
                            <option value="sekretaris">Sekretaris</option>
                            <option value="chef">Chef</option>
                            <option value="waiter">Waiter/Waitress</option>
                            <option value="kasir">Kasir</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <input type="submit" value="Simpan" class="tombol simpan">
                    <input type="reset" value="Batal" class="tombol reset">
                </div>

            </form>
        </section>

    </div>

    <footer>
        Copyright &copy; 2026
    </footer>

</body>
</html>
